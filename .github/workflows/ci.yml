name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - autobrr-mcp
          - bookshelf-mcp
          - cleanuparr-mcp
          - dashbrr-mcp
          - komga-mcp
          - lidarr-mcp
          - mylar3-mcp
          - profilarr-mcp
          - prowlarr-mcp
          - qbittorrent-mcp
          - qui-mcp
          - radarr-mcp
          - seerr-mcp
          - sonarr-mcp
          - tracearr-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run offline test suite
        run: |
          cd "${{ matrix.server }}"
          uv sync
          uv run pytest
